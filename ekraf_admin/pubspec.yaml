name: ekraf_admin
description: Platform Manajemen Ekonomi Kreatif - Mobile Admin App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  image_picker: ^1.1.2
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  uuid: ^4.4.2
  cached_network_image: ^3.4.1
  flutter_staggered_animations: ^1.1.1
  shimmer: ^3.0.0
  lottie: ^3.1.3
  fl_chart: ^0.69.0
  dotted_border: ^2.1.0
  gap: ^3.0.1
  google_fonts: ^6.2.1
  supabase_flutter: ^2.8.0
  path_provider: ^2.1.3
  share_plus: ^10.0.2
  permission_handler: ^11.3.0
  csv: ^6.0.0
  excel: ^4.0.6
  file_picker: ^8.0.0



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/

flutter_native_splash:
  background_image: assets/images/splash_bg.png
  image: assets/images/logo_dispopar_symbol.png
  android: true
  ios: true
  android_12:
    image: assets/images/logo_dispopar_symbol.png
    color: "#001C39"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo_dispopar_symbol.png"
  adaptive_icon_background: "#001C39"
  adaptive_icon_foreground: "assets/images/logo_dispopar_symbol.png"
